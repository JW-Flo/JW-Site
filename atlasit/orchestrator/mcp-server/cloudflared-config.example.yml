# Example cloudflared configuration for MCP server
# Copy to ~/.cloudflared/config.yml and adjust paths/IDs as needed.

# The tunnel UUID (keep in sync with created tunnel)
tunnel: c463b1fd-b6a3-4ab4-b2fe-50d5415f03cb

# Absolute path to credentials file generated by 'cloudflared tunnel create'
credentials-file: /Users/jw/.cloudflared/c463b1fd-b6a3-4ab4-b2fe-50d5415f03cb.json

# Ingress rules: first match wins
ingress:
  - hostname: mcp.atlasit.pro
    service: http://localhost:3000
  - service: http_status:404
