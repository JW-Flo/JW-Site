openapi: 3.0.3
info:
  title: AtlasIT MCP Server API
  version: 1.0.0
  description: API documentation for AtlasIT MCP Server endpoints.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  time:
                    type: integer
  /:
    get:
      summary: Home endpoint
      responses:
        '200':
          description: Server running message
          content:
            text/plain:
              schema:
                type: string
  /sse:
    get:
      summary: SSE heartbeat stream
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE stream of heartbeat events
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  timestamp:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /search:
    post:
      summary: Search documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /fetch:
    post:
      summary: Fetch document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Not found or missing id
  /tool/{name}:
    post:
      summary: Generic tool endpoint
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Tool response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Tool not found
        '500':
          description: Tool error
  /auth:
    get:
      summary: OAuth login
      responses:
        '302':
          description: Redirect to OAuth provider
  /callback:
    get:
      summary: OAuth callback
      responses:
        '302':
          description: Redirect to home on success or failure
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
