name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run deploy script with --dry-run"
        required: false
        default: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: admin-dashboard
      CF_PAGES_BRANCH: main
      CF_PAGES_DIST_DIR: apps/admin-dashboard/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate environment
        run: npm run validate:env

      - name: Check connector readiness
        run: npm run connectors:check

      - name: Check bundle sizes
        run: npm run check:bundle

      - name: Dry-run deploy
        run: |
          args=""
          if [ "${{ github.event.inputs.dry-run }}" != "false" ]; then
            args="-- --dry-run"
          fi
          npx wrangler pages deploy apps/admin-dashboard/dist --project-name admin-dashboard --branch=main $args
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
