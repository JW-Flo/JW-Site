<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Arcade Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .test-results {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <h1>🧪 Simple Arcade Button Test</h1>

    <div class="test-results" id="results">
        Loading test results...
    </div>

    <!-- Game Canvas (same as in BaseLayout) -->
    <canvas id="game-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; transition: opacity 1s; cursor: pointer; background: rgba(0,0,0,0.8);"></canvas>

    <!-- Arcade Button (same as in BaseLayout) -->
    <div class="game-trigger-container" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 60;">
        <button id="game-trigger" class="game-trigger-button" aria-label="Launch Retro Arcade" title="Click to play retro games!" style="width: 48px; height: 48px; border-radius: 9999px; background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a); border: 2px solid #3b82f6; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4), 0 0 20px rgba(99, 102, 241, 0.25);">
            🎮
        </button>
    </div>

    <!-- Load the site's JavaScript files -->
    <script type="module" src="http://localhost:4321/retro-arcade.js"></script>
    <script type="module" src="http://localhost:4321/GameOverlay.js"></script>

    <!-- Load our simple test script -->
    <script type="module" src="./simple-arcade-test.js"></script>

    <script>
        // Override console.log to display results in the page
        const originalLog = console.log;
        const originalError = console.error;
        const resultsDiv = document.getElementById('results');

        function addToResults(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToResults(args.join(' '), 'info');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addToResults('ERROR: ' + args.join(' '), 'error');
        };

        // Clear loading message
        resultsDiv.innerHTML = '';
    </script>
</body>
</html>
